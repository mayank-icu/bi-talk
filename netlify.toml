[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# Proxy API routes to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Serve static HTML pages & fallback for SPA routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
